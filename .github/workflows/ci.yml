    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # - name: Generate Prisma Client
      #   run: npx prisma generate

      - name: Type Check
        run: npx tsc --noEmit

      - name: Run Linter
        run: npm run lint

